<div class="login-page">
  <div class="login-card">
    <div class="logo">PHAN<span>LINK</span></div>

    @if (done()) {
      <p class="info">Password diubah. Mengarahkan ke halaman login…</p>
    } @else {
      <form class="login-form" (ngSubmit)="submit()">
        <div class="field">
          <div class="field-shadow"></div>
          <input
            type="password"
            name="password"
            [(ngModel)]="password"
            placeholder="Password baru"
            class="field-input"
            autocomplete="new-password"
          />
        </div>

        <div class="field">
          <div class="field-shadow"></div>
          <input
            type="password"
            name="confirm"
            [(ngModel)]="confirm"
            placeholder="Ulangi password baru"
            class="field-input"
            autocomplete="new-password"
          />
        </div>

        @if (error()) {
          <div class="error-text">{{ error() }}</div>
        }

        <button type="submit" class="submit-btn" [disabled]="loading()">
          {{ loading() ? 'MEMPROSES...' : 'UBAH PASSWORD' }}
        </button>
      </form>
    }

    <div class="switch-link"><a routerLink="/login">Kembali ke login</a></div>
  </div>
</div>
