<div class="login-page">
  <div class="login-card">
    <div class="logo">PHAN<span>LINK</span></div>

    @if (sent()) {
      <p class="info">Jika email terdaftar, tautan reset password sudah dikirim. Cek kotak masuk kamu.</p>
    } @else {
      <form class="login-form" (ngSubmit)="submit()">
        <div class="field">
          <div class="field-shadow"></div>
          <input
            type="email"
            name="email"
            [(ngModel)]="email"
            placeholder="Email akun kamu"
            class="field-input"
            autocomplete="email"
          />
        </div>

        @if (error()) {
          <div class="error-text">{{ error() }}</div>
        }

        <button type="submit" class="submit-btn" [disabled]="loading()">
          {{ loading() ? 'MENGIRIM...' : 'KIRIM TAUTAN RESET' }}
        </button>
      </form>
    }

    <div class="switch-link"><a routerLink="/login">Kembali ke login</a></div>
  </div>
</div>
