<div class="login-page">
  <div class="login-card">
    <div class="logo">PHAN<span>LINK</span></div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="login-form">
      <div class="field">
        <div class="field-shadow"></div>
        <input
          type="text"
          formControlName="login"
          placeholder="Email atau Username"
          class="field-input"
          [class.invalid]="!!fieldError('login')"
          [attr.aria-invalid]="!!fieldError('login')"
        />
      </div>
      @if (fieldError('login'); as e) {
        <div class="field-error">{{ e }}</div>
      }

      <div class="field">
        <div class="field-shadow"></div>
        <input
          type="password"
          formControlName="password"
          placeholder="Password"
          class="field-input"
          [class.invalid]="!!fieldError('password')"
          [attr.aria-invalid]="!!fieldError('password')"
        />
      </div>
      @if (fieldError('password'); as e) {
        <div class="field-error">{{ e }}</div>
      }

      <div class="forgot"><a routerLink="/forgot-password">Lupa password?</a></div>

      @if (errorMessage()) {
        <div class="error-text">{{ errorMessage() }}</div>
      }

      <button type="submit" class="submit-btn" [disabled]="loading()">
        {{ loading() ? 'MEMPROSES...' : 'MASUK' }}
      </button>
    </form>

    <div class="switch-link">
      Belum punya akun? <a routerLink="/register">Daftar di sini</a>
    </div>
  </div>
</div>
