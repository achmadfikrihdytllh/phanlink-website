<div class="window">
  <header class="titlebar">
    <span class="titlebar__brand"><i></i>Phantom / Messenger</span>
    <span class="titlebar__controls" aria-hidden="true"><b></b><b></b><b></b></span>
  </header>

  <div class="body">
    <nav class="rail" aria-label="Primary">
      <a class="rail__logo" routerLink="/messages" aria-label="Phanlink home">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#fff" aria-hidden="true">
          <path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-4 2-7 1 1 2 2 2 4 1-2 2-5 2-9Z" />
        </svg>
      </a>

      @for (item of items; track item.path) {
        <a
          class="rail__item"
          [routerLink]="item.path"
          routerLinkActive="active"
          [attr.aria-label]="item.label"
          [title]="item.label"
        >
          <pm-icon [name]="item.icon" [size]="15" />
        </a>
      }

      <span class="rail__tagline">Take your time</span>

      <a
        class="rail__item"
        routerLink="/settings"
        routerLinkActive="active"
        aria-label="Settings"
        title="Settings"
      >
        <pm-icon name="settings" [size]="15" />
      </a>
      <span class="rail__me" [title]="'Signed in'">{{ initial() }}</span>
    </nav>

    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
