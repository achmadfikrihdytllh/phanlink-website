# Builds an installable debug APK in the cloud (nothing to install on your PC).
# Run it from GitHub: Actions -> "Build Android APK" -> Run workflow, then download the artifact.
name: Build Android APK

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm run build -- --configuration production

      # Capacitor is only needed for the APK, so it is installed here instead of in package.json.
      - run: npm install --no-save @capacitor/core @capacitor/cli @capacitor/android
      - run: npx cap add android
      - run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: phanlink-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
